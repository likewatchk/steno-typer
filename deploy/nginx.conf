# steno web — 정적 서빙 + /api 프록시
# 컨테이너 내부 80, 호스트에는 1004 로 publish (VPN 443 과 접점 없음)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain;

    # 해시 자산 — 사우디 왕복을 재방문에서 없애는 핵심 (immutable 캐시)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50m;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 셸 폴백 — "/" 요청도 여기로 오므로 no-cache 필수.
    # (없으면 휴리스틱 캐시로 구버전 셸이 남아 새 자산과 어긋난다)
    # $uri/ 로 하위 디렉터리(index.html 보유, 예: /review/)도 서빙.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
