<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>나희의 속기 깜빡이</title>
    <!-- 이미지 파일 0 원칙 유지 — 하트 파비콘은 인라인 SVG 데이터 URI 로 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 첫 페인트 전에 테마 적용 (깜빡임 방지). 시스템 추종이 기본.
      ;(function () {
        try {
          var t = localStorage.getItem('steno-theme')
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
